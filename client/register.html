<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Register — Zambian Marketplace</title><link rel="stylesheet" href="styles.css"/></head><body><div class="container"><header class="page-header"><div class="brand"><a href="index.html"><img src="../assets/logo.png" class="logo-img" alt="Zambian Marketplace"/></a><div><h1 class="page-title">Register</h1><p class="page-description">Create an account to start buying, selling, or pre-ordering.</p></div></div><nav class="header-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav></header><section class="card" style="max-width:620px;margin:0 auto"><form id="register-form" class="grid grid-2"><div class="input-group"><label for="full-name">Full name</label><input id="full-name" type="text" placeholder="Your name" required/></div><div class="input-group"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required/></div><div class="input-group"><label for="password">Password</label><input id="password" type="password" placeholder="Choose a password" required/></div><div class="input-group"><label for="role">Account type</label><select id="role"><option value="CUSTOMER">Customer</option><option value="SELLER">Seller</option></select></div><div class="input-group"><label for="phone">Phone number</label><input id="phone" type="tel" placeholder="+260 97 123 4567"/></div><div class="input-group"><label for="payment-method">Preferred payment method</label><select id="payment-method"><option value="CARD">Card</option><option value="MOBILE_MONEY">Mobile money</option><option value="CASH">Cash</option><option value="BANK_TRANSFER">Bank transfer</option></select></div><div class="input-group"><label for="street">Street address</label><input id="street" type="text" placeholder="Plot 123, Main Road"/></div><div class="input-group"><label for="city">City</label><input id="city" type="text" placeholder="Lusaka"/></div><div class="input-group"><label for="province">Province</label><input id="province" type="text" placeholder="Lusaka"/></div><div class="input-group"><label for="country">Country</label><input id="country" type="text" placeholder="Zambia" value="Zambia"/></div><div class="input-group" style="grid-column:span 2"><label for="postal-code">Postal code</label><input id="postal-code" type="text" placeholder="10101"/></div><div id="form-status" class="status-message" style="grid-column:span 2" aria-live="polite"></div><button type="submit">Create account</button><button type="button" id="google-oauth-button" class="button-secondary">Continue with Google</button></form></section><footer class="footer-note">Register as a customer or seller and start using the marketplace today.</footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="app.js"></script><script src="auth-fix.js"></script></body></html>
