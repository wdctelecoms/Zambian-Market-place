<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart — Zambian Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <div class="brand">
          <a href="index.html"><img src="../assets/logo.png" class="logo-img" alt="Zambian Marketplace" /></a>
          <div>
            <h1 class="page-title">Shopping Cart</h1>
            <p class="page-description">Review items, update quantities, and proceed to checkout.</p>
          </div>
        </div>
        <nav class="header-nav">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="seller.html">Seller Dashboard</a>
          <a href="chat.html">Chat</a>
          <a href="login.html" data-action="logout">Logout</a>
        </nav>
      </header>

      <section class="card">
        <div id="cart-summary"></div>
        <div id="cart-status" class="status-message" aria-live="polite"></div>
      </section>

      <section class="card" style="margin-top: 1.5rem;">
        <h2>Checkout details</h2>
        <div class="grid grid-2" style="margin-top: 1rem;">
          <div>
            <label for="checkout-payment-method">Preferred payment</label>
            <select id="checkout-payment-method">
              <option value="CARD">Card</option>
              <option value="MOBILE_MONEY">Mobile money</option>
              <option value="CASH">Cash</option>
              <option value="BANK_TRANSFER">Bank transfer</option>
            </select>
          </div>
          <div>
            <h3>Saved delivery addresses</h3>
            <div id="saved-addresses" class="grid"></div>
          </div>
        </div>
        <form id="address-form" class="grid grid-2" style="margin-top: 1rem;">
          <div class="input-group">
            <label for="delivery-street">Street</label>
            <input id="delivery-street" type="text" placeholder="Plot 123, Main Road" required />
          </div>
          <div class="input-group">
            <label for="delivery-city">City</label>
            <input id="delivery-city" type="text" placeholder="Lusaka" required />
          </div>
          <div class="input-group">
            <label for="delivery-province">Province</label>
            <input id="delivery-province" type="text" placeholder="Lusaka" required />
          </div>
          <div class="input-group">
            <label for="delivery-country">Country</label>
            <input id="delivery-country" type="text" placeholder="Zambia" value="Zambia" required />
          </div>
          <div class="input-group" style="grid-column: span 2;">
            <label for="delivery-postal-code">Postal code</label>
            <input id="delivery-postal-code" type="text" placeholder="10101" required />
          </div>
          <button type="submit">Save delivery address</button>
        </form>
      </section>

      <section class="card" style="margin-top: 1.5rem;">
        <h2>Your items</h2>
        <div id="cart-items" class="grid" style="margin-top: 1rem;"></div>
      </section>

      <footer class="footer-note">
        Adjust quantities and pickup details before placing your order.
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
  </body>
</html>
