name: Apply direct Supabase auth runtime

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auth-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Supabase auth runtime
        shell: python
        run: |
          from pathlib import Path
          pages = [
              'login.html','register.html','shop.html','cart.html','seller.html',
              'chat.html','account.html','checkout.html','orders.html'
          ]
          supabase = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>'
          runtime = '<script src="auth-runtime.js"></script>'
          changed = []
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'auth-runtime.js' in text:
                  continue
              injection = supabase + '\n' + runtime + '\n'
              if '</head>' in text:
                  text = text.replace('</head>', injection + '</head>', 1)
              elif '</body>' in text:
                  text = text.replace('</body>', injection + '</body>', 1)
              else:
                  text += '\n' + injection
              p.write_text(text, encoding='utf-8')
              changed.append(name)
          print('Wired:', ', '.join(changed) if changed else 'none')

      - name: Commit auth runtime wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login.html register.html shop.html cart.html seller.html chat.html account.html checkout.html orders.html || true
          if git diff --cached --quiet; then
            echo "Auth runtime already wired."
            exit 0
          fi
          git commit -m "Wire direct Supabase auth into login and protected pages"
          git push
