name: Apply marketplace auth protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch authentication and protected pages
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          # Keep redirects on the current deployment instead of an old hard-coded workers.dev address.
          text = text.replace(
              'const MAIN_APP_SHOP_URL = "https://zambian-market-place.wdcentreprenuer.workers.dev/shop.html";',
              'const MAIN_APP_SHOP_URL = new URL("shop.html", window.location.href).href;'
          )

          # Keep checkout and orders inside the same Supabase-authenticated flow.
          text = text.replace(
              'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html"]);',
              'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html", "checkout.html", "orders.html"]);'
          )
          text = text.replace(
              'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "dashboard.html"]);',
              'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html", "checkout.html", "orders.html"]);'
          )
          text = text.replace(
              'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html"]);',
              'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html", "checkout.html", "orders.html"]);'
          )
          text = text.replace(
              'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "dashboard.html"]);',
              'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html", "checkout.html", "orders.html"]);'
          )

          # Email confirmation should return to the current deployment.
          text = text.replace(
              'emailRedirectTo: MAIN_APP_SHOP_URL,',
              'emailRedirectTo: new URL("shop.html", window.location.href).href,'
          )
          text = text.replace(
              'emailRedirectTo: "https://zambian-market-place.wdcentreprenuer.workers.dev/shop.html",',
              'emailRedirectTo: new URL("shop.html", window.location.href).href,'
          )

          marker = '  const user = await hydrateAuthSessionFromSupabase().catch(() => null);\n\n'
          guard = '  // Authenticate before rendering protected marketplace pages.\n  if (redirectToLoginIfNeeded()) return;\n\n'
          if marker in text and guard not in text:
              text = text.replace(marker, marker + guard, 1)

          text = text.replace(
              'redirectTo: window.location.origin,',
              'redirectTo: new URL("login.html", window.location.href).href,'
          )
          app.write_text(text, encoding='utf-8')

          # Every protected page must load Supabase + the shared auth runtime.
          protected = [
              'shop.html', 'cart.html', 'seller.html', 'chat.html',
              'account.html', 'checkout.html', 'orders.html'
          ]
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>'
          app_tag = '<script src="app.js"></script>'
          runtime_tag = '<script src="auth-runtime.js"></script>'

          for name in protected:
              p = Path(name)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              if 'auth-runtime.js' not in html:
                  injection = supabase_tag + '\n' + app_tag + '\n' + runtime_tag + '\n'
                  if '</body>' in html:
                      html = html.replace('</body>', injection + '</body>', 1)
                  elif '</head>' in html:
                      html = html.replace('</head>', injection + '</head>', 1)
                  else:
                      html += '\n' + injection
              elif 'supabase-js@2' not in html:
                  html = html.replace(app_tag, supabase_tag + '\n' + app_tag, 1)
              p.write_text(html, encoding='utf-8')

          # Login and registration also need the same Supabase client/runtime.
          for name in ['login.html', 'register.html']:
              p = Path(name)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              if 'auth-runtime.js' not in html:
                  injection = supabase_tag + '\n' + runtime_tag + '\n'
                  if '</body>' in html:
                      html = html.replace('</body>', injection + '</body>', 1)
                  elif '</head>' in html:
                      html = html.replace('</head>', injection + '</head>', 1)
                  else:
                      html += '\n' + injection
                  p.write_text(html, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js login.html register.html shop.html cart.html seller.html chat.html account.html checkout.html orders.html
          if git diff --cached --quiet; then
            echo "No authentication changes needed."
            exit 0
          fi
          git commit -m "Fix Supabase auth redirects and protected page wiring"
          git push
