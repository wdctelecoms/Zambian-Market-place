name: Apply marketplace auth protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Protect every marketplace page and wire live auth data
        shell: python
        run: |
          from pathlib import Path

          public_pages = {'index.html', 'intro.html', 'login.html', 'register.html'}
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>'
          guard_tag = '<script src="auth-guard.js"></script>'
          app_tag = '<script src="app.js"></script>'

          changed = []
          for p in sorted(Path('.').glob('*.html')):
              if p.name in public_pages:
                  continue

              html = p.read_text(encoding='utf-8')

              # The guard must run before application code so API requests carry
              # the current Supabase access token and unauthenticated users never
              # get a usable protected page.
              if 'auth-guard.js' not in html:
                  injection = supabase_tag + '\n' + guard_tag + '\n'
                  if 'app.js' in html:
                      html = html.replace(app_tag, injection + app_tag, 1)
                  elif '</head>' in html:
                      html = html.replace('</head>', injection + '</head>', 1)
                  elif '</body>' in html:
                      html = html.replace('</body>', injection + '</body>', 1)
                  else:
                      html += '\n' + injection

              # Make sure pages using the shared application logic actually load it.
              # Do not add a duplicate app.js if one is already present.
              if 'app.js' not in html and '</body>' in html:
                  html = html.replace('</body>', app_tag + '\n</body>', 1)

              if html != p.read_text(encoding='utf-8'):
                  p.write_text(html, encoding='utf-8')
                  changed.append(p.name)

          print('Protected/wired:', ', '.join(changed) if changed else 'none')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- auth-guard.js app.js .github/workflows/apply-auth-protection.yml
          for file in *.html; do
            [ -f "$file" ] || continue
            git add -- "$file"
          done

          if git diff --cached --quiet; then
            echo "All pages are already protected and wired."
            exit 0
          fi
          git commit -m "Protect all marketplace pages and load authenticated data"
          git push
