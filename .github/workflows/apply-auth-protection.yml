name: Apply marketplace auth protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch authentication and protected pages
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          old_set = 'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "dashboard.html"]);'
          new_set = 'const allowedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html"]);'
          text = text.replace(old_set, new_set)

          old_protected = 'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "dashboard.html"]);'
          new_protected = 'const protectedPages = new Set(["shop.html", "cart.html", "seller.html", "chat.html", "account.html"]);'
          text = text.replace(old_protected, new_protected)

          marker = '  const user = await hydrateAuthSessionFromSupabase().catch(() => null);\n\n'
          guard = '  // Authenticate before rendering protected marketplace pages.\n  if (redirectToLoginIfNeeded()) return;\n\n'
          if marker in text and guard not in text:
              text = text.replace(marker, marker + guard, 1)

          text = text.replace(
              'redirectTo: window.location.origin,',
              'redirectTo: new URL("login.html", window.location.href).href,'
          )
          app.write_text(text, encoding='utf-8')

          # All authenticated pages must load the shared auth/session code.
          protected = ['shop.html', 'cart.html', 'chat.html', 'seller.html', 'account.html']
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>'
          app_tag = '<script src="app.js"></script>'

          for name in protected:
              p = Path(name)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              if 'src="app.js"' not in html:
                  html = html.replace('</body>', f'{supabase_tag}\n{app_tag}\n</body>')
              elif 'supabase-js@2' not in html:
                  html = html.replace(app_tag, f'{supabase_tag}\n{app_tag}')
              p.write_text(html, encoding='utf-8')

          # shop.html has its own legacy dashboard script. Its old client
          # declaration shadows the global Supabase library and throws a
          # ReferenceError. Keep the existing UI but initialize the client
          # from window.supabase so the page can coexist with app.js.
          shop = Path('shop.html')
          if shop.exists():
              html = shop.read_text(encoding='utf-8')
              html = html.replace(
                  "const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);",
                  "const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);"
              )
              shop.write_text(html, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js shop.html cart.html chat.html seller.html account.html
          if git diff --cached --quiet; then
            echo "No authentication changes needed."
            exit 0
          fi
          git commit -m "Fix marketplace authentication and shop Supabase client"
          git push
